<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-ncards</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="view-grid">

<div id="topBar">
  <div class="t-left"><span id="brand">ai-ncards</span><span class="badge" id="cardCount">0</span></div>
  <div class="t-right">
    <button class="icon-btn" id="undoBtn" title="Undo" disabled><i class="fas fa-undo"></i></button>
    <button class="icon-btn" id="menuBtn" title="Settings"><i class="fas fa-cog"></i></button>
  </div>
</div>

<div id="grid"></div>

<div class="empty-state" id="emptyState">
  <div class="empty-icon"></div>
  <h3>New Document</h3>
  <p>Ask anything to begin</p>
  <div class="empty-hints">
    <span><i class="fas fa-pencil-alt"></i> Write a request</span>
    <span><i class="fas fa-magic"></i> Use !theme or !action</span>
    <span><i class="fas fa-ellipsis-h"></i> More via </span>
  </div>
</div>

<div id="selectionBar">
  <div class="sel-left">
    <button class="sel-btn danger" id="cancelSel">Cancel</button>
    <button class="sel-btn danger" id="deleteSel">Delete</button>
    <button class="sel-btn" id="mergeSel">Merge</button>
    <span id="selCount"></span>
  </div>
  <div class="sel-right">
    <button class="sel-btn" id="splitSel">Split</button>
    <button class="sel-btn" id="continueSel">Continue</button>
  </div>
</div>

<div class="input-area">
  <input type="text" id="input" placeholder="Write a request…" autocomplete="off" />
  <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>

<!-- modals container -->
<div id="modalContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="script.js" type="module"></script>
</body>
</html>
