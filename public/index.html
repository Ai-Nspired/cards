<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>kards — AI Card Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>kards</h1>
      <p class="subtitle">AI-generated cards — powered by your backend</p>
    </header>

    <main class="container">
      <section class="input-section">
        <label for="promptInput" class="visually-hidden">Prompt</label>
        <textarea id="promptInput" placeholder="Describe the card you want…"></textarea>
        <div class="actions">
          <button id="sendBtn" class="primary">Generate</button>
          <button id="stopBtn" class="ghost" title="Stop">✕</button>
        </div>
        <small class="hint">Supports streaming — toggle in Settings.</small>
      </section>

      <section class="settings" id="settingsSection">
        <details>
          <summary>Settings</summary>
          <div class="setting">
            <label>
              <input type="checkbox" id="toggleStream" />
              Stream responses (SSE)
            </label>
          </div>
          <div class="setting">
            <label>
              <input type="checkbox" id="toggleTTS" />
              Use TTS (if supported)
            </label>
          </div>
          <div class="setting">
            <label for="proxyInput">Proxy / Custom Endpoint (optional)</label>
            <input id="proxyInput" placeholder="https://your-endpoint/chat" />
          </div>
          <div class="setting">
            <button id="saveSettings">Save</button>
            <button id="clearAll" class="danger">Clear all cards</button>
          </div>
        </details>
      </section>

      <div id="traceInfo" style="font-size:12px;color:#666;margin-bottom:8px;min-height:20px;"></div>
      <div id="traceInfo2" style="font-size:12px;color:#666;margin-bottom:8px;min-height:20px;"></div>
      <section class="cards" id="cardContainer" aria-live="polite"></section>
    </main>
  </div>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
