<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curl Test Suite - Interactive Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }

        .status-badge.pending { background: #f59e0b; }
        .status-badge.success { background: #10b981; }
        .status-badge.error { background: #ef4444; }

        .card-body {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-primary:hover { background: #5856eb; }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-error {
            background: #ef4444;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 0%;
            height: 0%;
            opacity: 0;
            transition: all 0.3s ease;
            background-color: rgba(0,0,0,0.8);
        }

        .modal.show {
            display: block;
            opacity: 1;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2em;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover { color: #333; }

        .result-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result-section.active { display: block; }

        .result-section h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .result-body {
            background: white;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Curl Test Suite</h1>
            <p>Interactive frontend for testing curl commands</p>
        </div>

        <div class="test-grid" id="testGrid">
            <!-- Cards will be populated by JavaScript -->
        </div>
    </div>

    <!-- Modal for detailed results -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h3 id="modalTitle"></h3>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const tests = [
            {
                title: "GET Request",
                description: "Basic GET request to httpbin.org",
                method: "GET",
                url: "http://httpbin.org/get",
                expected: 200
            },
            {
                title: "POST JSON",
                description: "POST request with JSON data",
                method: "POST",
                url: "http://httpbin.org/post",
                extra: ["-H", "Content-Type: application/json", "-d", '{"test": "data"}'],
                expected: 200
            },
            {
                title: "POST Form",
                description: "POST request with form data",
                method: "POST",
                url: "http://httpbin.org/post",
                extra: ["-d", "key=value"],
                expected: 200
            },
            {
                title: "Headers",
                description: "GET request with custom headers",
                method: "GET",
                url: "http://httpbin.org/headers",
                extra: ["-H", "X-Custom: test", "-H", "User-Agent: Test/1.0"],
                expected: 200
            },
            {
                title: "Authentication",
                description: "Basic authentication test",
                method: "GET",
                url: "http://httpbin.org/basic-auth/user/pass",
                extra: ["-u", "user:pass"],
                expected: 200
            },
            {
                title: "Query Params",
                description: "GET request with query parameters",
                method: "GET",
                url: "http://httpbin.org/get?key1=value1&key2=value2",
                expected: 200
            },
            {
                title: "404 Error",
                description: "Error handling for 404 status",
                method: "GET",
                url: "http://httpbin.org/status/404",
                expected: 404
            },
            {
                title: "HTTPS",
                description: "HTTPS request to httpbin.org",
                method: "GET",
                url: "https://httpbin.org/get",
                expected: 200
            },
            {
                title: "Redirect",
                description: "Redirect handling with -L flag",
                method: "GET",
                url: "http://httpbin.org/redirect/1",
                extra: ["-L"],
                expected: 200
            },
            {
                title: "PUT Request",
                description: "PUT request to httpbin.org",
                method: "PUT",
                url: "http://httpbin.org/put",
                extra: ["-d", "test data"],
                expected: 200
            },
            {
                title: "DELETE Request",
                description: "DELETE request to httpbin.org",
                method: "DELETE",
                url: "http://httpbin.org/delete",
                expected: 200
            },
            {
                title: "Cookies",
                description: "Send cookies with request",
                method: "GET",
                url: "http://httpbin.org/cookies",
                extra: ["-b", "test=value"],
                expected: 200
            },
            {
                title: "Timeout",
                description: "5s timeout on slow endpoint",
                method: "GET",
                url: "http://httpbin.org/delay/5",
                extra: ["--max-time", "1"],
                expected: "timeout"
            }
        ];

        function runTest(test, cardElement) {
            const btn = cardElement.querySelector('.btn-run');
            const badge = cardElement.querySelector('.status-badge');
            const resultDiv = cardElement.querySelector('.result-section');
            const closeBtn = cardElement.querySelector('.modal-close');
            
            btn.disabled = true;
            badge.textContent = "Running...";
            badge.className = "status-badge pending";
            
            const formData = {
                method: test.method,
                url: test.url,
                extra: test.extra || []
            };
            
            fetch('/run_curl_test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                badge.textContent = data.success ? "PASSED" : "FAILED";
                badge.className = "status-badge " + (data.success ? "success" : "error");
                
                const resultContent = `
                    <div class="result-section active">
                        <h4>Command:</h4>
                        <div class="result-body">${data.command}</div>
                        ${data.stdout ? `<h4>Output:</h4><div class="result-body">${data.stdout}</div>` : ''}
                        ${data.stderr ? `<h4>Errors:</h4><div class="result-body">${data.stderr}</div>` : ''}
                        <h4>Status: <span class="badge badge-${data.success ? 'success' : 'error'}">${data.success ? 'OK' : 'FAIL'}</span></h4>
                    `;
                
                document.getElementById('modalTitle').textContent = test.title;
                document.getElementById('modalContent').innerHTML = resultContent;
                document.getElementById('resultModal').classList.add('show');
            })
            .catch(err => {
                badge.textContent = "ERROR";
                badge.className = "status-badge error";
                document.getElementById('modalContent').innerHTML = `<p>Error: ${err}</p>`;
                document.getElementById('resultModal').classList.add('show');
            });
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        function init() {
            const grid = document.getElementById('testGrid');
            tests.forEach((test, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${test.title}</span>
                        <span class="status-badge pending">Pending</span>
                    </div>
                    <div class="card-body">
                        <p>${test.description}</p>
                        <p><strong>Method:</strong> ${test.method}</p>
                        <p><strong>URL:</strong> ${test.url}</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary btn-run" onclick="runTest(${index}, this)">Run Test</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
